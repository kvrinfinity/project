<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Fitness Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      max-width: 900px;
      margin-top: 40px;
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2, h4 {
      color: #2c3e50;
    }

    label {
      font-weight: 600;
      margin-top: 10px;
    }

    input[type="text"], input[type="file"] {
      margin-bottom: 15px;
    }

    .border {
      border: 2px dashed #ccc !important;
      border-radius: 10px;
      background-color: #fdfdfd;
    }

    .btn-primary {
      background-color: #5A67D8;
      border-color: #5A67D8;
      padding: 10px 30px;
      font-size: 16px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #434190;
    }

    .mb-2::placeholder {
      color: #adb5bd;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">✏️ Edit Fitness Test</h2>
    <form method="POST" enctype="multipart/form-data">
      <label>Test Name:</label>
      <input type="text" name="test_name" class="form-control" value="{{ test.test_name }}" required>

      <label>New Test Image (optional):</label>
      <input type="file" name="test_image" class="form-control">

      <label>New Test Video (optional):</label>
      <input type="file" name="fitness_video" class="form-control">

      <h4 class="mt-4">Edit Questions</h4>

      {% for q in test.questions %}
      <div class="border p-3 mb-4">
        <input type="text" name="ft_question[]" class="form-control mb-2" value="{{ q.question.text }}" placeholder="Question Text">

        {% if q.question.image_id %}
          <input type="hidden" name="existing_q_img_ids[]" value="{{ q.question.image_id }}">
        {% else %}
          <input type="hidden" name="existing_q_img_ids[]" value="">
        {% endif %}
        <input type="file" name="ft_question_image[]" class="form-control mb-2">

        {% for opt in ['a', 'b', 'c', 'd'] %}
          <input type="text" name="ft_option_{{opt}}[]" class="form-control mb-1" value="{{ q.options[opt].text }}" placeholder="Option {{opt|upper}}">

          {% if q.options[opt].image_id %}
            <input type="hidden" name="existing_ft_option_{{opt}}_img_ids[]" value="{{ q.options[opt].image_id }}">
          {% else %}
            <input type="hidden" name="existing_ft_option_{{opt}}_img_ids[]" value="">
          {% endif %}
          <input type="file" name="ft_option_{{opt}}_img[]" class="form-control mb-2">
        {% endfor %}

        <input type="text" name="ft_answer[]" class="form-control" value="{{ q.answer }}" required placeholder="Correct Answer (a/b/c/d)">
        <input type="text" name="ft_company[]" class="form-control" value="{{ q.company }}" required placeholder="Company">
      </div>
      {% endfor %}

      <div class="text-center">
        <button type="submit" class="btn btn-primary">💾 Update Test</button>
      </div>
    </form>
  </div>
</body>
</html>
