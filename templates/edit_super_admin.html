<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Super Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background: #004080;
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar h2 {
      font-size: 22px;
      margin: 0;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      color: #004080;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #004080;
      box-shadow: 0 0 5px rgba(0, 64, 128, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 25px;
      background: #004080;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #003060;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px;
        padding: 20px;
      }

      h2 {
        font-size: 20px;
      }

      button {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h2><i class="fas fa-user-edit"></i> Edit Super Admin</h2>
  </div>

  <div class="container">
    <form method="POST">
      <input type="hidden" name="super_admin_id" value="{{ admin._id }}">

      <label>Name</label>
      <input type="text" name="name" value="{{ admin.name }}" required>

      <label>Email</label>
      <input type="text" name="email" value="{{ admin.email }}" required>

      <label>WhatsApp</label>
      <input type="text" name="whatsapp" value="{{ admin.whatsapp }}" required>

      <label>Account Holder Name</label>
      <input type="text" name="account_holder" value="{{ admin.account_holder }}" required>

      <label>Account Number</label>
      <input type="text" name="account_number" value="{{ admin.account_number }}" required>

      <label>Bank Name</label>
      <input type="text" name="bank_name" value="{{ admin.bank_name }}" required>

      <label>Branch</label>
      <input type="text" name="branch" value="{{ admin.branch }}" required>

      <label>IFSC</label>
      <input type="text" name="ifsc" value="{{ admin.ifsc }}" required>

      <label>UPI</label>
      <input type="text" name="upi" value="{{ admin.upi }}" required>

      <button type="submit"><i class="fas fa-save"></i> Update</button>
    </form>
  </div>

</body>
</html>
